services:
  frontend:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: pokedame-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pokedame-api
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./api:/app
      - pokemon_asset_storage:/app/storage
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POKEMON_ASSET_STORAGE_DIR: /app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: pokedame-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  postgres_data:
  pokemon_asset_storage: